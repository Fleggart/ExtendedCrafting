plugins {
    id 'java'
    id 'eclipse'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

// ========== 基础信息 ==========
def modVersion = "1.0.0"
def modId = "examplemod"
def modName = "Example Mod"
def modGroup = "com.example.mod"
def minecraftVersion = "1.12.2"

version = modVersion
group = modGroup
base { archivesName = modId }

// ========== Minecraft 配置 ==========
minecraft {
    mcVersion = minecraftVersion
    username = "Dev"
}

// ========== 依赖仓库 ==========
repositories {
    mavenCentral()
    maven { url 'https://maven.cleanroommc.com' }
    maven { url 'https://cursemaven.com' }
    maven { url 'https://maven.blamejared.com' }
}

dependencies {
    // 1.12.2 Forge（自动由 retrofuturagradle 提供）
    // 如果需要 JEI（可选）
    
    implementation 'curse.maven:jei-238222:8526969'
    implementation 'curse.maven:cucumber-272335:2645867'
    implementation 'curse.maven:TheOneProbe-245211:2667280'
    compileOnlyApi rfg.deobf("CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.660")
    compileOnly 'curse.maven:hwyla-253449:2568751'
}

// ========== 资源处理 ==========
processResources {
    filesMatching('mcmod.info') {
        expand 'modid': modId, 'modname': modName, 'version': modVersion, 'mcversion': minecraftVersion
    }
}

// ========== 生成 mcmod.info ==========
tasks.register('generateAssets') {
    doLast {
        def f = file('src/main/resources/mcmod.info')
        if (!f.exists()) {
            f.text = """[{
    "modid": "\${modid}",
    "name": "\${modname}",
    "version": "\${version}",
    "mcversion": "\${mcversion}"
}]
"""
        }
    }
}
tasks.processResources.dependsOn(generateAssets)
